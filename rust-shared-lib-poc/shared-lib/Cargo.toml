[package]
name = "shared-lib"
version = "0.1.0"
edition = "2021"
description = "Shared library that bundles serde, serde_json, and tokio"

[lib]
# dylib provides Rust metadata and uses dynamic libstd
crate-type = ["dylib"]

[dependencies]
# Specify features directly - meson reads these from Cargo.toml
# Pin to versions compatible with meson cargo support (no build.rs)
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.100"
tokio = { version = "=1.40.0", features = ["rt", "rt-multi-thread", "time", "macros"] }
